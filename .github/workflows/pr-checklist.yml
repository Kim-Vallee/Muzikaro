name: Pull Request and Push checklist
run-name: Testing pnpm install / check / test / build
on: [push,pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    environment: Muzikaro
    env:
      AUDIO_DIR: ${{ vars.AUDIO_DIR }}
      COVERS_DIR: ${{ vars.COVERS_DIR }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      CLIENT_ID_GITHUB: ${{ secrets.CLIENT_ID_GITHUB }}
      CLIENT_SECRET_GITHUB: ${{ secrets.CLIENT_SECRET_GITHUB }}
      DATABASE_URL: ${{ vars.DATABASE_URL }}
      DEBUG: $${{ vars.DEBUG }}
    steps:
      - name: Checkout 
        uses: actions/checkout@v7
      - name: Setup pnpm 
        uses: pnpm/setup@v2
      - name: Migration
        run: pnpm run db:migrate
      - name: Type check
        run: pnpm run check
      - name: Run tests
        run: pnpm run test
      - name: Build
        run: pnpm run build